<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>HTML დავალება</title>

  <!-- 
    0) case-sensitive ნიშნავს, რომ სიმბოლოების大小 (დიდი/პატარა ასოები) მნიშვნელოვანია. 
    მაგალითად: "Title" და "title" ჩაითვლება განსხვავებულად.

    case-insensitive ნიშნავს, რომ დიდი და პატარა ასოებს არ განასხვავებს. 
    მაგალითად: "HELLO", "hello" და "HeLLo" ჩაითვლება ერთნაირად.
  -->
</head>
<body>

  <!-- 
    1) <br> თეგის გამოყენება თითო ღილაკის შემდეგ აჩენს ღილაკებს ცალ-ცალკე ხაზზე.
  -->
  <button>Button 1</button><br>
  <button>Button 2</button><br>
  <button>Button 3</button><br>

  <!-- 
    2) კომენტარები HTML-ში გამოიყენება იმისთვის, რომ
       კოდის შიგნით გავაკეთოთ შენიშვნები პროგრამისტებისთვის.
       ბრაუზერი ამ ტექსტს არ აჩვენებს. იგი მხოლოდ კოდში ჩანს.
  -->

  <!-- 
    3) სწორი ინდენტაცია ნიშნავს, რომ HTML ელემენტები სწორად არის ჩამოწერილი და შიგთავსი ერთმანეთზე სწორადაა განლაგებული.
    ეს არ ცვლის კოდის მუშაობას, მაგრამ კოდის წაკითხვა და დამუშავება ბევრად უფრო მარტივია.
  -->

  <!-- 
    4) Nesting ნიშნავს ელემენტის შიგნით სხვა ელემენტის ჩასმას.
    მაგალითად:
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
      </ul>
    აქ <li> ელემენტები დაბუდებულია <ul> ელემენტში. ეს ჰქვია nesting.
  -->

</body>
</html>

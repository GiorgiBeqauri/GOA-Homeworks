<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
Semantic თეგები არის ისეთი HTML ელემენტები, რომლებსაც აქვთ მნიშვნელობა.
ანუ ისინი არ არიან მხოლოდ ვიზუალური, არამედ აჩვენებენ ბრაუზერს და საძიებო სისტემებს რა შინაარსი აქვს ელემენტს.

მაგალითად:
<header> ნიშნავს თავსართს
<article> ნიშნავს სტატიას ან დამოუკიდებელ შინაარსს
<footer> ნიშნავს ქვედა ნაწილს
-->

<header>    <!-- გვერდის ან სექციის თავსართი -->
    <nav>       <!-- ნავიგაცია (მენიუ, ბმულები) -->
    <main>      <!-- მთავარი შინაარსი -->
    <article>   <!-- დამოუკიდებელი სტატია -->
    <section>   <!-- სექცია, თემა -->
    <aside>     <!-- გვერდითი ინფორმაცია (სარეკლამო, ბმულები) -->
    <footer>    <!-- ქვედა ნაწილი -->
</body>
</html>
